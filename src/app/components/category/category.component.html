<section class="relative bg-gradient-to-br from-cyan-900 to-blue-800 py-16 overflow-hidden">
  
    <div class="container mx-auto px-4 relative z-10">
      <div class="max-w-3xl mx-auto text-center mb-12">
        <h1 class="text-4xl md:text-5xl font-bold text-white mb-6">Discover Culinary Delights from Around the World</h1>
        <p class="text-lg text-cyan-100 mb-8">Explore authentic recipes, flavors, and cooking techniques from every corner of the globe.</p>
        
        <div class="flex flex-wrap justify-center gap-3 mb-10">
          <button class="px-6 py-3 bg-white text-cyan-800 rounded-lg font-semibold shadow-lg hover:bg-cyan-50 transition-all duration-300 transform hover:-translate-y-1">
            Start Exploring
          </button>
          <button class="px-6 py-3 bg-transparent border-2 border-white text-white rounded-lg font-semibold hover:bg-white/10 transition-all duration-300">
            Popular Recipes
          </button>
        </div>
      </div>
  
      <!-- Interactive country bubbles -->
      <div class="flex flex-wrap justify-center gap-4 py-4">
        <div *ngFor="let country of countries; let i = index" 
             class="flex justify-center items-center h-20 w-20 rounded-full border-2 border-cyan-200 bg-cyan-700 text-white shadow-lg cursor-pointer transition-all duration-300 hover:scale-110 hover:bg-cyan-600">
          <h2 class="text-center text-sm font-medium">{{country}}</h2>
        </div>
      </div>
      
      <!-- Stats or features -->
      <div class="flex flex-wrap justify-center gap-6 mt-12">
        <div class="flex items-center bg-white/10 backdrop-blur-sm rounded-lg p-3 text-white">
          <div class="mr-3 bg-cyan-600 p-2 rounded-full">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v6m0 0v6m0-6h6m-6 0H6" />
            </svg>
          </div>
          <div>
            <p class="text-sm font-medium">5,000+</p>
            <p class="text-xs opacity-80">Unique Recipes</p>
          </div>
        </div>
        
        <div class="flex items-center bg-white/10 backdrop-blur-sm rounded-lg p-3 text-white">
          <div class="mr-3 bg-cyan-600 p-2 rounded-full">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3.055 11H5a2 2 0 012 2v1a2 2 0 002 2 2 2 0 012 2v2.945M8 3.935V5.5A2.5 2.5 0 0010.5 8h.5a2 2 0 012 2 2 2 0 104 0 2 2 0 012-2h.5A2.5 2.5 0 0020 5.5v-1.65" />
            </svg>
          </div>
          <div>
            <p class="text-sm font-medium">120+</p>
            <p class="text-xs opacity-80">Countries</p>
          </div>
        </div>
        
        <div class="flex items-center bg-white/10 backdrop-blur-sm rounded-lg p-3 text-white">
          <div class="mr-3 bg-cyan-600 p-2 rounded-full">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z" />
            </svg>
          </div>
          <div>
            <p class="text-sm font-medium">2M+</p>
            <p class="text-xs opacity-80">Community Members</p>
          </div>
        </div>
      </div>
    </div>
  

  </section>
