<!-- navbar.component.html -->
<header class="bg-blue-500 shadow-md">
  <nav class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    <div class="flex justify-between items-center h-16">
      <!-- Logo and hamburger menu section -->
      <div class="flex items-center">
        <button
          type="button"
          class="inline-flex items-center justify-center p-2 rounded-md text-white hover:bg-cyan-500 focus:outline-none focus:ring-2 focus:ring-inset focus:ring-white"
          aria-controls="mobile-menu"
          aria-expanded="false"
          (click)="toggleMenu()"
        >
          <span class="sr-only">Open main menu</span>
          <!-- Hamburger icon -->
          <svg
            class="h-6 w-6"
            xmlns="http://www.w3.org/2000/svg"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor"
            aria-hidden="true"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M4 6h16M4 12h16M4 18h16"
            />
          </svg>
        </button>
        <div class="flex-shrink-0 flex items-center ml-4">
          <h1 class="text-white text-xl font-semibold">Logo</h1>
        </div>
      </div>

      <!-- Search section -->
      <div class="flex-1 max-w-md mx-4">
        <div class="relative">
          <input
            type="text"
            placeholder="Search ..."
            [(ngModel)]="searchText"
            (input)="onSearchChange()"
            class="w-full py-3 px-5 pr-12 rounded-full border-0 focus:ring-2 focus:ring-cyan-400 shadow-lg text-gray-700"
          />
          <button
            class="absolute right-3 top-1/2 transform -translate-y-1/2 bg-cyan-600 text-white p-2 rounded-full hover:bg-cyan-500 transition-colors"
          >
            <svg
              xmlns="http://www.w3.org/2000/svg"
              class="h-5 w-5"
              fill="none"
              viewBox="0 0 24 24"
              stroke="currentColor"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"
              />
            </svg>
          </button>
        </div>
      </div>

      <!-- User profile section -->
      <div class="relative">
        <button
          class="bg-cyan-600 p-2 rounded-full text-white hover:bg-cyan-500 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-offset-cyan-500 focus:ring-white"
          (click)="toggleDropdown()"
        >
          <span class="sr-only">View user profile</span>
          <ng-container *ngIf="!isAuthenticated">
            <svg
              class="h-6 w-6"
              xmlns="http://www.w3.org/2000/svg"
              fill="none"
              viewBox="0 0 24 24"
              stroke="currentColor"
              aria-hidden="true"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"
              />
            </svg>
          </ng-container>
          <ng-container *ngIf="isAuthenticated">
            <div class="text-white font-bold text-sm ">
              {{ currentUser?.firstName[0]+""+currentUser?.lastName[0] | uppercase }}
            </div>
          </ng-container>
        </button>
        <div
  *ngIf="isDropdownOpen && isAuthenticated"
  class="absolute right-0 mt-2 w-48 bg-white rounded-md shadow-lg py-2 z-50"
>
  <a
    routerLink="/profile"
    class="block px-4 py-2 text-sm text-gray-700 hover:bg-gray-100"
    (click)="toggleDropdown()"
  >
    View Profile
  </a>
  <button
    (click)="logout(); toggleDropdown()"
    class="block w-full text-left px-4 py-2 text-sm text-gray-700 hover:bg-gray-100"
  >
    Logout
  </button>
</div>

        <!-- Enhanced Dropdown -->
        <div
          *ngIf="isDropdownOpen && !isAuthenticated"
          class="absolute right-0 mt-3 w-64 bg-white rounded-lg shadow-xl z-50 overflow-hidden transform transition-all duration-200 ease-out border border-gray-100"
        >
          <div class="px-4 py-3 bg-gray-50 border-b border-gray-100">
            <h3 class="text-sm font-medium text-gray-700">Account Access</h3>
          </div>

          <div class="py-2">
            <button
              (click)="login()"
              class="w-full flex items-center px-4 py-3 text-gray-700 hover:bg-blue-50 transition-colors duration-150"
            >
              <svg
                xmlns="http://www.w3.org/2000/svg"
                class="h-5 w-5 mr-3 text-blue-500"
                viewBox="0 0 20 20"
                fill="currentColor"
              >
                <path
                  fill-rule="evenodd"
                  d="M3 3a1 1 0 011-1h12a1 1 0 011 1v3a1 1 0 01-.293.707L12 11.414V15a1 1 0 01-.293.707l-2 2A1 1 0 018 17v-5.586L3.293 6.707A1 1 0 013 6V3z"
                  clip-rule="evenodd"
                />
              </svg>
              <span class="font-medium">Log In</span>
              <svg
                xmlns="http://www.w3.org/2000/svg"
                class="h-4 w-4 ml-auto text-gray-400"
                viewBox="0 0 20 20"
                fill="currentColor"
              >
                <path
                  fill-rule="evenodd"
                  d="M7.293 14.707a1 1 0 010-1.414L10.586 10 7.293 6.707a1 1 0 011.414-1.414l4 4a1 1 0 010 1.414l-4 4a1 1 0 01-1.414 0z"
                  clip-rule="evenodd"
                />
              </svg>
            </button>

            <button
              (click)="register()"
              class="w-full flex items-center px-4 py-3 text-gray-700 hover:bg-blue-50 transition-colors duration-150"
            >
              <svg
                xmlns="http://www.w3.org/2000/svg"
                class="h-5 w-5 mr-3 text-green-500"
                viewBox="0 0 20 20"
                fill="currentColor"
              >
                <path
                  d="M8 9a3 3 0 100-6 3 3 0 000 6zM8 11a6 6 0 016 6H2a6 6 0 016-6z"
                />
              </svg>
              <span class="font-medium">Register</span>
              <svg
                xmlns="http://www.w3.org/2000/svg"
                class="h-4 w-4 ml-auto text-gray-400"
                viewBox="0 0 20 20"
                fill="currentColor"
              >
                <path
                  fill-rule="evenodd"
                  d="M7.293 14.707a1 1 0 010-1.414L10.586 10 7.293 6.707a1 1 0 011.414-1.414l4 4a1 1 0 010 1.414l-4 4a1 1 0 01-1.414 0z"
                  clip-rule="evenodd"
                />
              </svg>
            </button>
          </div>
        </div>
      </div>
    </div>
  </nav>

  <!-- Mobile menu, show/hide based on menu state -->
  <div
    id="mobile-menu"
    class="fixed inset-0 overflow-hidden z-50"
    [ngClass]="{ hidden: !isMenuOpen }"
  >
    <!-- Backdrop -->
    <div
      class="absolute inset-0 bg-gray-500 bg-opacity-75 transition-opacity"
      (click)="toggleMenu()"
    ></div>

    <aside
      class="absolute inset-y-0 left-0 max-w-xs w-full bg-white shadow-xl transform transition ease-in-out duration-300"
    >
      <div class="h-full flex flex-col py-6 bg-white shadow-xl overflow-y-auto">
        <!-- Menu header with close button -->
        <div class="px-4 sm:px-6 flex items-center justify-between">
          <h2 class="text-lg font-medium text-gray-900">Menu</h2>
          <button
            type="button"
            class="rounded-md text-gray-400 hover:text-gray-500 focus:outline-none focus:ring-2 focus:ring-blue-500"
            (click)="toggleMenu()"
          >
            <span class="sr-only">Close panel</span>
            <svg
              class="h-6 w-6"
              xmlns="http://www.w3.org/2000/svg"
              fill="none"
              viewBox="0 0 24 24"
              stroke="currentColor"
              aria-hidden="true"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M6 18L18 6M6 6l12 12"
              />
            </svg>
          </button>
        </div>

        <!-- Menu content -->
        <nav class="mt-6 px-2 space-y-1">
          <a
            routerLink="/recipe"
            class="group flex items-center px-2 py-2 text-base font-medium rounded-md text-gray-900 hover:bg-blue-50 hover:text-cyan-600"
          >
            <svg
              class="mr-4 h-6 w-6 text-cyan-500"
              xmlns="http://www.w3.org/2000/svg"
              fill="none"
              viewBox="0 0 24 24"
              stroke="currentColor"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"
              />
            </svg>
            Home
          </a>

          <a
            routerLink="/create-recipe"
            class="group flex items-center px-2 py-2 text-base font-medium rounded-md text-gray-900 hover:bg-blue-50 hover:text-cyan-600"
          >
            <svg
              class="mr-4 h-6 w-6 text-cyan-500"
              xmlns="http://www.w3.org/2000/svg"
              fill="none"
              viewBox="0 0 24 24"
              stroke="currentColor"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M12 9v3m0 0v3m0-3h3m-3 0H9m12 0a9 9 0 11-18 0 9 9 0 0118 0z"
              />
            </svg>
            Submit your recipe
          </a>

          <a
            routerLink="/favorites"
            class="group flex items-center px-2 py-2 text-base font-medium rounded-md text-gray-900 hover:bg-blue-50 hover:text-cyan-600"
          >
            <svg
              class="mr-4 h-6 w-6 text-cyan-500"
              xmlns="http://www.w3.org/2000/svg"
              fill="none"
              viewBox="0 0 24 24"
              stroke="currentColor"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"
              />
            </svg>
            View Favorites
          </a>

          <a
            routerLink="/my-recipes"
            class="group flex items-center px-2 py-2 text-base font-medium rounded-md text-gray-900 hover:bg-blue-50 hover:text-cyan-600"
          >
            <svg
              class="mr-4 h-6 w-6 text-cyan-500"
              xmlns="http://www.w3.org/2000/svg"
              fill="none"
              viewBox="0 0 24 24"
              stroke="currentColor"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"
              />
            </svg>
            View Your recipes
          </a>

          <a
            routerLink="/recommend"
            class="group flex items-center px-2 py-2 text-base font-medium rounded-md text-gray-900 hover:bg-blue-50 hover:text-cyan-600"
          >
            <svg
              class="mr-4 h-6 w-6 text-cyan-500"
              xmlns="http://www.w3.org/2000/svg"
              fill="none"
              viewBox="0 0 24 24"
              stroke="currentColor"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M11.049 2.927c.3-.921 1.603-.921 1.902 0l1.519 4.674a1 1 0 00.95.69h4.915c.969 0 1.371 1.24.588 1.81l-3.976 2.888a1 1 0 00-.363 1.118l1.518 4.674c.3.922-.755 1.688-1.538 1.118l-3.976-2.888a1 1 0 00-1.176 0l-3.976 2.888c-.783.57-1.838-.197-1.538-1.118l1.518-4.674a1 1 0 00-.363-1.118l-3.976-2.888c-.784-.57-.38-1.81.588-1.81h4.914a1 1 0 00.951-.69l1.519-4.674z"
              />
            </svg>
            Recommended recipes
          </a>

          <a
            href="#"
            class="group flex items-center px-2 py-2 text-base font-medium rounded-md text-gray-900 hover:bg-blue-50 hover:text-cyan-600"
          >
            <svg
              class="mr-4 h-6 w-6 text-cyan-500"
              xmlns="http://www.w3.org/2000/svg"
              fill="none"
              viewBox="0 0 24 24"
              stroke="currentColor"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"
              />
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"
              />
            </svg>
            Preferences
          </a>
        </nav>
      </div>
    </aside>
  </div>
</header>
