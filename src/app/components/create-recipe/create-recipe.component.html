<form [formGroup]="recipeForm" (ngSubmit)="onSubmit()" novalidate class="max-w-lg mx-auto p-6 bg-white rounded-lg shadow-md">
  <h2 class="text-2xl font-bold mb-6 text-gray-800 border-b pb-2">Add New Recipe</h2>
  
  <div class="mb-4">
    <label class="block text-gray-700 text-sm font-bold mb-2" for="name">Recipe Name</label>
    <input type="text" formControlName="name" id="name" 
           class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-indigo-500" />
    <div *ngIf="recipeForm.get('name')?.touched && recipeForm.get('name')?.invalid" 
         class="text-red-500 text-xs mt-1">
      Name is required.
    </div>
  </div>
  
  <div class="mb-4">
    <label class="block text-gray-700 text-sm font-bold mb-2" for="image">Image URL</label>
    <input type="text" formControlName="image" id="image" 
           class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-indigo-500" />
    <div *ngIf="recipeForm.get('image')?.touched && recipeForm.get('image')?.invalid" 
         class="text-red-500 text-xs mt-1">
      Enter a valid image URL.
    </div>
  </div>
  
  <div class="mb-4">
    <label class="block text-gray-700 text-sm font-bold mb-2" for="description">Description (steps separated by commas)</label>
    <textarea formControlName="description" id="description" rows="4" 
              class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-indigo-500"></textarea>
    <div *ngIf="recipeForm.get('description')?.touched && recipeForm.get('description')?.invalid" 
         class="text-red-500 text-xs mt-1">
      Description is required.
    </div>
  </div>
  
  <div class="mb-4">
    <label class="block text-gray-700 text-sm font-bold mb-2" for="ingredients">Ingredients (comma-separated)</label>
    <input type="text" formControlName="ingredients" id="ingredients" 
           class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-indigo-500" />
    <div *ngIf="recipeForm.get('ingredients')?.touched && recipeForm.get('ingredients')?.invalid" 
         class="text-red-500 text-xs mt-1">
      At least one ingredient is required.
    </div>
  </div>
  
  <div class="grid grid-cols-2 gap-4">
    <div class="mb-4">
      <label class="block text-gray-700 text-sm font-bold mb-2" for="cuisine">Cuisine</label>
      <input type="text" formControlName="cuisine" id="cuisine" 
             class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-indigo-500" />
      <div *ngIf="recipeForm.get('cuisine')?.touched && recipeForm.get('cuisine')?.invalid" 
           class="text-red-500 text-xs mt-1">
        Cuisine is required.
      </div>
    </div>
    
    <div class="mb-4">
      <label class="block text-gray-700 text-sm font-bold mb-2" for="category">Category</label>
      <input type="text" formControlName="category" id="category" 
             class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-indigo-500" />
      <div *ngIf="recipeForm.get('category')?.touched && recipeForm.get('category')?.invalid" 
           class="text-red-500 text-xs mt-1">
        Category is required.
      </div>
    </div>
  </div>
  
  <div class="mb-4">
    <label class="block text-gray-700 text-sm font-bold mb-2" for="tags">Tags (comma-separated)</label>
    <input type="text" formControlName="tags" id="tags" 
           class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-indigo-500" />
    <div *ngIf="recipeForm.get('tags')?.touched && recipeForm.get('tags')?.invalid" 
         class="text-red-500 text-xs mt-1">
      Tags are required.
    </div>
  </div>
  
  <div class="grid grid-cols-2 gap-4">
    <div class="mb-4">
      <label class="block text-gray-700 text-sm font-bold mb-2" for="cookingTime">Cooking Time (minutes)</label>
      <input type="number" formControlName="cookingTime" id="cookingTime" 
             class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-indigo-500" />
      <div *ngIf="recipeForm.get('cookingTime')?.touched && recipeForm.get('cookingTime')?.invalid" 
           class="text-red-500 text-xs mt-1">
        Enter a valid cooking time.
      </div>
    </div>
    
    <div class="mb-4">
      <label class="block text-gray-700 text-sm font-bold mb-2" for="difficulty">Difficulty</label>
      <select formControlName="difficulty" id="difficulty" 
              class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-indigo-500 bg-white">
        <option value="">Select</option>
        <option value="Easy">Easy</option>
        <option value="Medium">Medium</option>
        <option value="Hard">Hard</option>
      </select>
      <div *ngIf="recipeForm.get('difficulty')?.touched && recipeForm.get('difficulty')?.invalid" 
           class="text-red-500 text-xs mt-1">
        Difficulty is required.
      </div>
    </div>
  </div>
  
  <button type="submit" 
          class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-2 px-4 rounded-md focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:ring-opacity-50 mt-6 transition duration-200 ease-in-out">
    Submit Recipe
  </button>
  
  <div *ngIf="errorMessage" class="text-red-500 text-sm font-medium mt-4 p-3 bg-red-50 rounded">
    {{ errorMessage }}
  </div>
</form>
